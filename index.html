<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>قتال ستيك مان - أنمي</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#05060f">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ستيك مان">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; -webkit-user-select: none; touch-action: manipulation; }
  html, body { margin:0; padding:0; background:#05060f; color:#fff; font-family: -apple-system, "Segoe UI", Tahoma, sans-serif; overflow:hidden; height:100%; }
  #wrap { position:relative; width:100%; max-width:480px; margin:0 auto; height:100vh; display:flex; flex-direction:column; }
  #hud { padding:10px 12px 4px; }
  .bars { display:flex; align-items:center; gap:10px; }
  .barBox { flex:1; min-width:0; }
  .name { font-size:12px; margin-bottom:3px; display:flex; justify-content:space-between; color:#cfd3ee; }
  .hpOuter { height:14px; border-radius:7px; background:#171a33; border:1px solid #2b2f55; overflow:hidden; }
  .hpInner { height:100%; width:100%; transition: width .15s linear; }
  #p1hp { background: linear-gradient(90deg,#2fd0f7,#7df3ff); }
  #p2hp { background: linear-gradient(90deg,#ffa04d,#ff5b4d); float:right; }
  .enOuter { height:6px; margin-top:4px; border-radius:3px; background:#171a33; overflow:hidden; }
  #p1en { background:#ffc43c; height:100%; width:0%; transition: width .15s linear; }
  #timer { text-align:center; font-size:22px; font-weight:900; min-width:34px; color:#ffd76a; }
  #arena { flex:1; position:relative; background: radial-gradient(ellipse at 50% 25%, #241a4e 0%, #0b0e23 65%, #05060f 100%); overflow:hidden; }
  canvas { display:block; }
  #overlay { position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; background:rgba(4,5,16,.74); z-index:10; text-align:center; gap:16px; }
  #overlayTitle { font-size:38px; margin:0; font-weight:900; letter-spacing:1px; }
  #restartBtn { display:none; padding:11px 30px; font-size:15px; border-radius:24px; border:none; background:#2fd0f7; color:#04202b; font-weight:700; }
  #controls { display:flex; justify-content:space-between; align-items:flex-end; padding:12px 14px 22px; gap:10px; }
  .padGroup, .atkGroup { display:flex; flex-direction:column; align-items:center; gap:8px; }
  .padRow { display:flex; gap:10px; }
  .btn { width:54px; height:54px; border-radius:50%; border:2px solid rgba(255,255,255,.22); background:rgba(255,255,255,.07); color:#fff; font-size:19px; display:flex; align-items:center; justify-content:center; }
  .btn:active { background:rgba(255,255,255,.22); transform:scale(.92); }
  .atkGroup .btn.special { width:62px; height:62px; background:rgba(255,196,60,.14); border-color:#ffc43c; }
  .atkGroup .btn.special.ready { box-shadow:0 0 14px #ffc43c; }
  .comboRow { display:flex; gap:10px; }
  .shake { animation: shk .3s; }
  @keyframes shk { 0%,100%{transform:translateX(0)} 25%{transform:translateX(-4px)} 75%{transform:translateX(4px)} }
</style>
</head>
<body>
<div id="wrap">
  <div id="hud">
    <div class="bars">
      <div class="barBox">
        <div class="name"><span>أنت</span><span id="p1hpText">100</span></div>
        <div class="hpOuter"><div id="p1hp" class="hpInner"></div></div>
        <div class="enOuter"><div id="p1en"></div></div>
      </div>
      <div id="timer">60</div>
      <div class="barBox">
        <div class="name"><span id="p2hpText">100</span><span>العدو</span></div>
        <div class="hpOuter"><div id="p2hp" class="hpInner"></div></div>
      </div>
    </div>
  </div>
  <div id="arena">
    <canvas id="game"></canvas>
    <div id="overlay">
      <h1 id="overlayTitle">استعد</h1>
      <button id="restartBtn">إعادة الجولة</button>
    </div>
  </div>
  <div id="controls">
    <div class="padGroup">
      <button class="btn" id="jumpBtn">⬆</button>
      <div class="padRow">
        <button class="btn" id="leftBtn">◀</button>
        <button class="btn" id="rightBtn">▶</button>
      </div>
    </div>
    <div class="atkGroup">
      <button class="btn special" id="specialBtn">⚡</button>
      <div class="comboRow">
        <button class="btn" id="kickBtn">🦵</button>
        <button class="btn" id="punchBtn">✊</button>
      </div>
    </div>
  </div>
</div>

<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const arena = document.getElementById('arena');
const overlay = document.getElementById('overlay');
const overlayTitle = document.getElementById('overlayTitle');
const restartBtn = document.getElementById('restartBtn');
const timerEl = document.getElementById('timer');
const p1hp = document.getElementById('p1hp'), p2hp = document.getElementById('p2hp');
const p1hpText = document.getElementById('p1hpText'), p2hpText = document.getElementById('p2hpText');
const p1en = document.getElementById('p1en');
const specialBtn = document.getElementById('specialBtn');

const GRAVITY = 0.7, JUMP_SPEED = 13, MOVE_SPEED = 3.2, ROUND_TIME = 60, SPECIAL_COST = 45;
const ACTION_DUR = { punch:18, kick:24, special:30, hurt:12 };
const HIT_WIN = { punch:6, kick:8 };

let WORLD_W=360, WORLD_H=400, GROUND_Y=320;
let player, enemy, projectiles=[], sparks=[], damageTexts=[];
let leftHeld=false, rightHeld=false, aiCooldown=0, frameCount=0;
let startTime=0, roundOver=false, countingDown=true;

function clamp(v,a,b){ return Math.max(a,Math.min(b,v)); }

function resizeCanvas(){
  const rect = arena.getBoundingClientRect();
  WORLD_W = rect.width; WORLD_H = rect.height;
  const dpr = window.devicePixelRatio || 1;
  canvas.width = WORLD_W*dpr; canvas.height = WORLD_H*dpr;
  canvas.style.width = WORLD_W+'px'; canvas.style.height = WORLD_H+'px';
  ctx.setTransform(dpr,0,0,dpr,0,0);
  GROUND_Y = WORLD_H*0.8;
}

function newFighter(x, color, isPlayer){
  return { x, y:0, vx:0, vy:0, onGround:true, hp:100, energy:0, facing:isPlayer?1:-1,
    state:'idle', stateTimer:0, hasHit:false, specialFired:false, cooldown:0, color, isPlayer };
}

function resetGame(){
  player = newFighter(WORLD_W*0.28, '#3ED6F7', true);
  enemy = newFighter(WORLD_W*0.72, '#FF5B4D', false);
  projectiles=[]; sparks=[]; damageTexts=[];
  roundOver=false; aiCooldown=30;
  updateHPBars();
}

function startCountdown(cb){
  const seq=['استعد','٣','٢','١','قاتل!'];
  let i=0;
  overlay.style.display='flex';
  restartBtn.style.display='none';
  countingDown=true;
  (function step(){
    overlayTitle.textContent = seq[i]; i++;
    if(i<seq.length) setTimeout(step,500);
    else setTimeout(()=>{ overlay.style.display='none'; restartBtn.style.display='inline-block'; countingDown=false; cb(); },450);
  })();
}

function doAction(f, type){
  if(!f.onGround) return;
  if(['punch','kick','special','hurt'].includes(f.state)) return;
  if(f.cooldown>0) return;
  if(type==='special'){
    if(f.energy < SPECIAL_COST){ if(f.isPlayer){ specialBtn.classList.add('shake'); setTimeout(()=>specialBtn.classList.remove('shake'),300); } return; }
    f.energy -= SPECIAL_COST;
    f.specialFired = false;
  }
  f.state = type; f.stateTimer = ACTION_DUR[type]; f.hasHit=false; f.cooldown = ACTION_DUR[type]+12;
}

function tryMeleeHit(a,d){
  const dx = (d.x-a.x)*a.facing;
  const range = a.state==='kick' ? 92 : 72;
  if(dx>8 && dx<range && Math.abs(a.y-d.y)<60){
    const dmg = a.state==='kick' ? 10 : 6;
    applyDamage(a,d,dmg, a.facing*4);
    a.hasHit = true;
  }
}

function applyDamage(a,d,dmg,knock){
  d.hp = Math.max(0, d.hp-dmg);
  d.vx = knock;
  d.state='hurt'; d.stateTimer=10;
  a.energy = Math.min(100, a.energy+10);
  d.energy = Math.min(100, d.energy+6);
  spawnHitSpark(d.x + a.facing*18, GROUND_Y - d.y - 70, a.color);
  spawnDamageText(d.x, GROUND_Y - d.y - 92, '-'+dmg, a.color);
  updateHPBars();
  if(d.hp<=0 && !roundOver) endRound(a===player, false);
}

function spawnProjectile(f){
  projectiles.push({ x:f.x+f.facing*40, y:f.y+48, vx:f.facing*8.5, owner:f, life:150 });
}

function updateProjectiles(){
  for(let i=projectiles.length-1;i>=0;i--){
    const p = projectiles[i];
    p.x += p.vx; p.life--;
    const target = p.owner===player ? enemy : player;
    if(Math.abs(p.x-target.x)<30 && Math.abs(p.y-(target.y+48))<55){
      applyDamage(p.owner, target, 18, (target.x>p.owner.x?1:-1)*7);
      spawnHitSpark(p.x, GROUND_Y-p.y, p.owner.color);
      projectiles.splice(i,1); continue;
    }
    if(p.life<=0 || p.x<-20 || p.x>WORLD_W+20) projectiles.splice(i,1);
  }
}

function aiUpdate(){
  if(['punch','kick','special','hurt'].includes(enemy.state)){ if(aiCooldown>0) aiCooldown--; return; }
  const dx = player.x-enemy.x, dist = Math.abs(dx);
  if(dist>150) enemy.vx = Math.sign(dx)*MOVE_SPEED*0.85;
  else if(dist<65) enemy.vx = -Math.sign(dx)*MOVE_SPEED*0.6;
  else enemy.vx *= 0.7;

  if(aiCooldown>0){ aiCooldown--; return; }
  if(!enemy.onGround) return;
  if(dist<95){
    const r = Math.random();
    if(r<0.45) doAction(enemy,'punch');
    else if(r<0.8) doAction(enemy,'kick');
    else if(enemy.energy>=SPECIAL_COST) doAction(enemy,'special');
    aiCooldown = 45+Math.floor(Math.random()*35);
  } else if(dist>170 && enemy.energy>=SPECIAL_COST && Math.random()<0.02){
    doAction(enemy,'special'); aiCooldown=60;
  }
}

function handleInput(){
  if(!['punch','kick','special','hurt'].includes(player.state)){
    if(leftHeld && !rightHeld) player.vx=-MOVE_SPEED;
    else if(rightHeld && !leftHeld) player.vx=MOVE_SPEED;
    else player.vx*=0.8;
  }
}

function updatePhysics(f){
  if(!f.onGround || f.vy!==0){
    f.vy -= GRAVITY; f.y += f.vy;
    if(f.y<=0){ f.y=0; f.vy=0; f.onGround=true; } else f.onGround=false;
  }
  f.x += f.vx;
  f.x = clamp(f.x, 40, WORLD_W-40);
  if(['punch','kick','special','hurt'].includes(f.state)) f.vx *= 0.85;
  if(f.onGround){
    if(f.state==='idle' && Math.abs(f.vx)>0.4) f.state='walk';
    else if(f.state==='walk' && Math.abs(f.vx)<0.4) f.state='idle';
    else if(f.state==='jump') f.state='idle';
  } else if(f.state==='idle'||f.state==='walk'){ f.state='jump'; }
}

function updateFighterState(f, opp){
  if(f.stateTimer>0){
    f.stateTimer--;
    if((f.state==='punch'||f.state==='kick') && !f.hasHit){
      const activeStart = ACTION_DUR[f.state]-HIT_WIN[f.state];
      if(f.stateTimer<=activeStart && f.stateTimer>activeStart-6) tryMeleeHit(f,opp);
    }
    if(f.state==='special' && !f.specialFired && f.stateTimer<=ACTION_DUR.special-14){
      spawnProjectile(f); f.specialFired=true;
    }
    if(f.stateTimer<=0) f.state = f.onGround?'idle':'jump';
  }
  if(f.cooldown>0) f.cooldown--;
  if(!countingDown && !roundOver) f.energy = Math.min(100, f.energy+0.04);
}

function separateFighters(){
  const minD=55, d=enemy.x-player.x;
  if(Math.abs(d)<minD){ const push=(minD-Math.abs(d))/2*(d<0?-1:1); player.x-=push; enemy.x+=push; }
}

function updateTimer(){
  const elapsed=(performance.now()-startTime)/1000;
  const left=Math.max(0, ROUND_TIME-elapsed);
  timerEl.textContent = Math.ceil(left);
  if(left<=0 && !roundOver){
    if(player.hp>enemy.hp) endRound(true,false);
    else if(enemy.hp>player.hp) endRound(false,false);
    else endRound(false,true);
  }
}

function endRound(playerWon, draw){
  roundOver = true;
  setTimeout(()=>{
    overlay.style.display='flex';
    overlayTitle.textContent = draw ? 'تعادل!' : (playerWon ? 'فزت! 🎉' : 'خسرت 💀');
  }, 450);
}

function updateHPBars(){
  p1hp.style.width = player.hp+'%';
  p2hp.style.width = enemy.hp+'%';
  p1hpText.textContent = Math.round(player.hp);
  p2hpText.textContent = Math.round(enemy.hp);
  p1en.style.width = player.energy+'%';
  specialBtn.classList.toggle('ready', player.energy>=SPECIAL_COST);
}

function spawnHitSpark(x,y,color){ sparks.push({x,y,life:10,color}); }
function spawnDamageText(x,y,text,color){ damageTexts.push({x,y,life:34,text,color}); }

function updateEffects(){
  for(let i=sparks.length-1;i>=0;i--){ sparks[i].life--; if(sparks[i].life<=0) sparks.splice(i,1); }
  for(let i=damageTexts.length-1;i>=0;i--){ const t=damageTexts[i]; t.y-=1; t.life--; if(t.life<=0) damageTexts.splice(i,1); }
}

function drawStickman(f){
  const baseX=f.x, baseY=GROUND_Y-f.y;
  ctx.save();
  ctx.translate(baseX, baseY);
  ctx.scale(f.facing,1);
  ctx.strokeStyle=f.color; ctx.lineWidth=5; ctx.lineCap='round'; ctx.lineJoin='round';

  if(f.energy>=SPECIAL_COST || f.state==='special'){
    ctx.save();
    ctx.globalAlpha = 0.16+Math.sin(frameCount*0.15)*0.05;
    ctx.fillStyle=f.color;
    ctx.beginPath(); ctx.arc(0,-55,44,0,Math.PI*2); ctx.fill();
    ctx.restore();
  }

  const bob = f.state==='idle' ? Math.sin(frameCount*0.08)*2 : 0;
  const hipY=-46+bob, headY=-92+bob, shY=-70+bob;
  const walkSwing = f.state==='walk' ? Math.sin(frameCount*0.35)*15 : 0;

  ctx.beginPath();
  ctx.moveTo(0,hipY); ctx.lineTo(-8+walkSwing*0.4,0);
  ctx.moveTo(0,hipY); ctx.lineTo(8-walkSwing*0.4,0);
  if(f.state==='kick'){
    const ext = 1-Math.abs(f.stateTimer-6)/18;
    ctx.moveTo(0,hipY); ctx.lineTo(26+ext*22, hipY+8);
  }
  ctx.stroke();

  ctx.beginPath(); ctx.moveTo(0,hipY); ctx.lineTo(0,shY); ctx.stroke();

  ctx.beginPath(); ctx.arc(0,headY,13,0,Math.PI*2); ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(-9,headY-8); ctx.lineTo(-4,headY-21);
  ctx.moveTo(-2,headY-11); ctx.lineTo(2,headY-24);
  ctx.moveTo(6,headY-8); ctx.lineTo(12,headY-19);
  ctx.stroke();

  ctx.beginPath();
  if(f.state==='punch'){
    const ext = 1-Math.abs(f.stateTimer-7)/11;
    ctx.moveTo(0,shY); ctx.lineTo(26+ext*16, shY+5);
    ctx.moveTo(0,shY); ctx.lineTo(-9, shY+17);
    ctx.stroke();
  } else if(f.state==='special'){
    ctx.moveTo(0,shY); ctx.lineTo(24, shY+13);
    ctx.moveTo(0,shY); ctx.lineTo(24, shY-3);
    ctx.stroke();
    ctx.save();
    ctx.fillStyle=f.color; ctx.globalAlpha=0.85;
    ctx.beginPath(); ctx.arc(30, shY+5, 9+Math.sin(frameCount*0.5)*3,0,Math.PI*2); ctx.fill();
    ctx.restore();
  } else {
    ctx.moveTo(0,shY); ctx.lineTo(-9, shY+17);
    ctx.moveTo(0,shY); ctx.lineTo(9, shY+17);
    ctx.stroke();
  }
  ctx.restore();
}

function drawProjectile(p){
  const bx=p.x, by=GROUND_Y-p.y;
  ctx.save();
  ctx.fillStyle=p.owner.color;
  ctx.shadowColor=p.owner.color; ctx.shadowBlur=14;
  ctx.beginPath(); ctx.arc(bx,by,9,0,Math.PI*2); ctx.fill();
  ctx.restore();
}

function drawSpark(s){
  ctx.save();
  ctx.globalAlpha = s.life/10;
  ctx.strokeStyle = s.color; ctx.lineWidth=3;
  for(let a=0;a<6;a++){
    const ang = a*Math.PI/3 + frameCount*0.1;
    ctx.beginPath();
    ctx.moveTo(s.x,s.y);
    ctx.lineTo(s.x+Math.cos(ang)*(10-s.life), s.y+Math.sin(ang)*(10-s.life));
    ctx.stroke();
  }
  ctx.restore();
}

function drawDamageText(t){
  ctx.save();
  ctx.globalAlpha = clamp(t.life/34,0,1);
  ctx.fillStyle = t.color;
  ctx.font = '900 16px -apple-system, sans-serif';
  ctx.textAlign='center';
  ctx.fillText(t.text, t.x, t.y);
  ctx.restore();
}

function draw(){
  ctx.clearRect(0,0,WORLD_W,WORLD_H);
  ctx.strokeStyle='rgba(255,255,255,.15)'; ctx.lineWidth=2;
  ctx.beginPath(); ctx.moveTo(0,GROUND_Y+2); ctx.lineTo(WORLD_W,GROUND_Y+2); ctx.stroke();
  drawStickman(player); drawStickman(enemy);
  projectiles.forEach(drawProjectile);
  sparks.forEach(drawSpark);
  damageTexts.forEach(drawDamageText);
  frameCount++;
}

function loop(){
  if(!roundOver && !countingDown){
    handleInput();
    player.facing = enemy.x>player.x?1:-1;
    enemy.facing = player.x>enemy.x?1:-1;
    updatePhysics(player); updatePhysics(enemy);
    updateFighterState(player, enemy); updateFighterState(enemy, player);
    aiUpdate();
    updateProjectiles();
    separateFighters();
    updateEffects();
    updateTimer();
    updateHPBars();
  } else {
    updateEffects();
  }
  draw();
  requestAnimationFrame(loop);
}

function bindHold(el, onDown, onUp){
  el.addEventListener('pointerdown', e=>{ e.preventDefault(); onDown(); });
  el.addEventListener('pointerup', e=>{ e.preventDefault(); onUp(); });
  el.addEventListener('pointerleave', ()=>onUp());
  el.addEventListener('pointercancel', ()=>onUp());
}

bindHold(document.getElementById('leftBtn'), ()=>leftHeld=true, ()=>leftHeld=false);
bindHold(document.getElementById('rightBtn'), ()=>rightHeld=true, ()=>rightHeld=false);
document.getElementById('jumpBtn').addEventListener('pointerdown', e=>{
  e.preventDefault();
  if(player.onGround && !['punch','kick','special','hurt'].includes(player.state)){ player.vy=JUMP_SPEED; player.onGround=false; }
});
document.getElementById('punchBtn').addEventListener('pointerdown', e=>{ e.preventDefault(); doAction(player,'punch'); });
document.getElementById('kickBtn').addEventListener('pointerdown', e=>{ e.preventDefault(); doAction(player,'kick'); });
specialBtn.addEventListener('pointerdown', e=>{ e.preventDefault(); doAction(player,'special'); });
restartBtn.addEventListener('click', ()=>{
  resetGame();
  startCountdown(()=>{ startTime=performance.now(); });
});

window.addEventListener('resize', resizeCanvas);
resizeCanvas();
resetGame();
requestAnimationFrame(loop);
startCountdown(()=>{ startTime=performance.now(); });

if('serviceWorker' in navigator){
  window.addEventListener('load', ()=>{ navigator.serviceWorker.register('sw.js'); });
}
</script>
</body>
</html>
